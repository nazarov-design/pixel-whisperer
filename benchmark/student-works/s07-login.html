<!doctype html><html><head><meta charset="utf-8"><meta name="render-size" content="1000x700">
<style>*{margin:0;padding:0;box-sizing:border-box}body{width:1000px;height:700px;background:url() ,linear-gradient(160deg,#FF9A9E,#FAD0C4,#A18CD1);font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.box{width:380px;background:rgba(255,255,255,.35);border-radius:20px;padding:34px;text-align:center;border:1px solid rgba(255,255,255,.5)}
h1{color:#fff;font-size:30px}p{color:#fff;font-size:12px;margin:6px 0 22px}
input{display:block;width:100%;margin:10px 0;padding:12px;border-radius:8px;border:none;background:rgba(255,255,255,.6);font-size:13px;color:#fff}
.row{display:flex;justify-content:space-between;font-size:11px;color:#fff;margin:6px 0 18px}.btn{background:#fff;color:#C77DFF;font-weight:bold;padding:12px;border-radius:8px;font-size:14px}
.or{color:#fff;font-size:11px;margin:16px 0}.soc{display:flex;gap:10px}.soc div{flex:1;padding:10px;border-radius:8px;background:rgba(255,255,255,.4);color:#fff;font-size:12px}.su{margin-top:18px;font-size:11px;color:#fff}
</style></head><body><div class="box"><h1>Welcome Back!</h1><p>Please login to your account</p><input placeholder="Email"><input placeholder="Password" type="password">
<div class="row"><span>☐ Remember me</span><span>Forgot password?</span></div><div class="btn">LOGIN</div><div class="or">— or continue with —</div><div class="soc"><div>Google</div><div>Apple</div><div>Facebook</div></div><div class="su">Don't have an account? Sign up</div></div></body></html>
